- name: check SQL Server Manager Studio installer exists
  win_stat:
    path: c:\setup\mssql\SSMS_installer.exe
  register: ssms_installer_file

- name: get the installer
  win_get_url:
      url: 'https://aka.ms/ssmsfullsetup'
      dest: 'c:\setup\mssql\SSMS_installer.exe'
  when: not ssms_installer_file.stat.exists

# aka.ms/ssmsfullsetup now serves SSMS 21+ (22.9.2 at the time of writing),
# which is a Visual Studio Installer bootstrapper of about 5MB rather than the
# old standalone SSMS 18 setup of about 700MB. That breaks this role twice:
#
#  - it installs under "Microsoft SQL Server Management Studio <version>", so
#    a hardcoded "...Studio 18" check never matches and SSMS is reinstalled on
#    every run
#  - the bootstrapper only understands the VS installer's double-dash switches.
#    Handed the old "/install /quiet /norestart" it ignores them and tries to
#    raise its UI, which cannot appear in a non-interactive WinRM session, so
#    the task hangs indefinitely with no output and the whole build stalls.
- name: check SSMS installation already done
  win_shell: |
    $d = Get-ChildItem 'C:\Program Files\Microsoft SQL Server Management Studio*', 'C:\Program Files (x86)\Microsoft SQL Server Management Studio*' -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($d) { 'INSTALLED' } else { 'MISSING' }
  register: ssms_installation
  changed_when: false

- name: Install SSMS
  win_command: c:\setup\mssql\SSMS_installer.exe --quiet --norestart
  register: install_ssmss
  when: "'MISSING' in ssms_installation.stdout"
  # Bound the install instead of letting it stall the build forever.
  async: 3600
  poll: 30
  # SSMS is a convenience GUI. Nothing in the SCCM lab depends on it, so a slow
  # or failed install must not stop the AD/MECM stages that follow.
  failed_when: false

- name: Reboot after install
  win_reboot:
    reboot_timeout: 600
  when: "'MISSING' in ssms_installation.stdout"